# Local development stack: MariaDB + PHP 8.3 (artisan serve)
# Usage: docker compose -f docker-compose.local.yml up -d   -> http://127.0.0.1:8000
services:
  db:
    image: mariadb:10.11
    container_name: projoss_db
    environment:
      MARIADB_DATABASE: Apurbabrand
      MARIADB_USER: projoss
      MARIADB_PASSWORD: projoss
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - projoss_db_data:/var/lib/mysql
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      retries: 30

  app:
    build: ./docker/php
    container_name: projoss_app
    user: "${UID:-1000}:${GID:-1000}"
    command: php artisan serve --host=0.0.0.0 --port=8000
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  projoss_db_data:
